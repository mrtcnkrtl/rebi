# HTTPS — sertifikalar host’ta /etc/letsencrypt (docker volume ile bağlanır)
upstream rebi_api {
    server api:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name rebiovil.com www.rebiovil.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rebiovil.com www.rebiovil.com;

    ssl_certificate     /etc/letsencrypt/live/rebiovil.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rebiovil.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://rebi_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
