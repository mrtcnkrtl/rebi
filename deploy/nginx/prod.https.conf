# HTTPS — sertifikalar host’ta /etc/letsencrypt (docker volume ile bağlanır)
# Docker'ın iç DNS'i. api konteyneri her deploy'da yeniden oluşturulur ve IP'si değişebilir; nginx adı yalnızca
# açılışta çözseydi eski IP'ye gidip 502 verirdi. `resolve` ile ad 10 sn'de bir yeniden çözülür (nginx >= 1.27.3).
resolver 127.0.0.11 valid=10s ipv6=off;

# Kenar hız sınırı: tek bir IP'den gelen sel API'ye ulaşmadan durur. Türkiye'de mobil operatörler çok sayıda
# kullanıcıyı aynı IP'nin arkasına koyar (CGNAT); bu yüzden sınır cömerttir. Kullanıcı başına asıl sınırlar API'de.
limit_req_zone $binary_remote_addr zone=api_per_ip:20m rate=40r/s;

upstream rebi_api {
    zone rebi_api 64k;
    server api:8000 resolve;
    # Açık bağlantı havuzu: her istekte API'ye yeni TCP bağlantısı açılmaz. uvicorn'un keep-alive süresi (75 sn)
    # bundan uzun olmalı (Dockerfile); yoksa nginx kapanmış bağlantıya yazar ve ara sıra 502 olur.
    keepalive 32;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name rebiovil.com www.rebiovil.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rebiovil.com www.rebiovil.com;

    ssl_certificate     /etc/letsencrypt/live/rebiovil.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rebiovil.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;
    # JSON yanıtları (geçmiş, rutin, sohbet) mobil veride 3-5 kat küçülür.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml application/manifest+json;

    # Boşta kalan istemci bağlantıları çabuk bırakılsın (yoğunlukta bağlantı yuvası dolmasın).
    keepalive_timeout 20s;

    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # .webmanifest mime.types'ta yok; nosniff ile octet-stream tarayıcıda reddedilir
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=80 nodelay;
        limit_req_status 429;
        error_page 429 = @api_rate_limited;
        # API kapalı / yeniden başlıyor / zaman aşımı: HTML hata sayfası yerine uygulamanın anlayacağı JSON.
        # (API'nin kendi döndürdüğü 503'ler olduğu gibi geçer; bu yalnızca nginx'in ürettiği hatalar için.)
        error_page 502 503 504 = @api_unavailable;

        proxy_pass http://rebi_api/;
        proxy_http_version 1.1;
        # Boş Connection başlığı olmadan upstream keepalive çalışmaz (her istek bağlantıyı kapatır).
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # İç ağ: API ayakta değilse 60 sn beklemek yerine hemen 503 JSON dön.
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail":"Sunucu kısa süreliğine yanıt vermiyor. Birazdan tekrar dene."}';
    }

    location @api_rate_limited {
        default_type application/json;
        add_header Retry-After 2 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"detail":"Çok hızlı istek gönderildi. Birkaç saniye sonra tekrar dene."}';
    }
}
