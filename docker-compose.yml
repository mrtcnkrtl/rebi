# rebiovil.com — tek sunucu: nginx (80) + FastAPI (iç ağ)
# Kullanım: repo kökünde .env dosyası (deploy/env.docker.example kopyası) + deploy/.env.api

# Docker'ın varsayılan json-file günlüğü sınırsız büyür; yoğun trafikte disk dolar ve sunucu durur.
# Her servis en fazla 5 x 20 MB günlük tutar.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  api:
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./deploy/.env.api
    environment:
      # Hız sınırı ve sohbet kotası sayaçları Redis'te tutulur (yeniden başlatma/deploy sayaçları sıfırlamaz).
      # Redis kapanırsa API çalışmaya devam eder, sayaçlar o süre süreç içine düşer. Redis'siz çalışmak için bu satırı silin.
      REDIS_URL: redis://redis:6379/0
      # API işçi sayısı (Dockerfile). 2 çekirdek / 2-4 GB sunucu için 2; 4 çekirdek / 8 GB için 4. Repo kökündeki
      # .env'de WEB_CONCURRENCY=4 yazarak değiştirilir. Postgres bağlantı bütçesi (POSTGRES_MAX_CONCURRENT, varsayılan 16)
      # işçilere bölünür; Supabase sınırı proje başınadır.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    # Deploy sırasında süren istekler (sohbet dahil) bitsin: uvicorn 25 sn bekler, Docker 30 sn sonra zorla kapatır.
    stop_grace_period: 30s
    volumes:
      - ./supabase/migrations:/supabase/migrations:ro
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 12s
      retries: 4
      start_period: 40s

  # Hatırlatıcı bildirimlerini 5 dakikada bir dağıtır (backend/push_cron.py).
  # PUSH_DISPATCH_SECRET deploy/.env.api'de tanımlı değilse kapalı bekler, hata vermez.
  push-cron:
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "push_cron.py"]
    env_file:
      - ./deploy/.env.api
    environment:
      PUSH_DISPATCH_URL: http://api:8000/push/dispatch?max_users=20000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    # Görüntüdeki HEALTHCHECK API portunu yoklar; bu konteynerde port yok. Döngü canlıysa dosya güncellenir.
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/push_cron_alive')<900 else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 360s

  # Hız sınırı ve sohbet kotası sayaçları (backend/redis_client.py). Yalnızca iç ağdan erişilir, dışarı port açılmaz.
  # AOF açık: yeniden başlatmada sayaçlar korunur. Sayaçların hepsi süreli anahtardır; 128 MB çok fazlasıyla yeter.
  redis:
    logging: *default-logging
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    logging: *default-logging
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: ${VITE_API_URL:-https://rebiovil.com/api}
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
