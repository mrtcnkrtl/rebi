# Mobil uygulama (Flutter): her push ve PR'da analiz + test.
# Dağıtım akışından (deploy-rebiovil.yml) bağımsızdır; yalnızca mobile/ değişince çalışır.
name: Mobile CI

on:
  push:
    branches:
      - main
      - flutter-mobile
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Statik analiz
        run: flutter analyze

      - name: Testler
        run: flutter test
