# Mobil uygulama (Flutter): her push ve PR'da analiz + test.
# Dağıtım akışından (deploy-rebiovil.yml) bağımsızdır; yalnızca mobile/ ya da API sözleşmesi (contract/) değişince çalışır.
# Analiz + test geçince Android (R8 + kaynak küçültme) ve iOS (proje dosyası, Pod, gizlilik dosyası) release
# derlemeleri denenir; imzasızdır, yalnızca derlemenin kırılmadığını doğrular.
name: Mobile CI

on:
  push:
    branches:
      - main
      - flutter-mobile
    paths:
      - 'mobile/**'
      - 'contract/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'contract/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Statik analiz
        run: flutter analyze

      - name: Testler
        run: flutter test

  build-android:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Release paketi (imzasız, debug anahtarıyla)
        run: flutter build appbundle --release

      - name: Paket boyutu (özet sayfasına yazılır)
        run: |
          size=$(stat -c %s build/app/outputs/bundle/release/app-release.aab)
          echo "### Android paketi (AAB): $((size / 1024 / 1024)).$(((size / 1024 % 1024) * 10 / 1024)) MB" >> "$GITHUB_STEP_SUMMARY"
          echo "Mağazadan inen boyut AAB'den küçüktür (cihaza özel bölünür)." >> "$GITHUB_STEP_SUMMARY"

  build-ios:
    needs: analyze-and-test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: iOS release derlemesi (imzasız)
        run: flutter build ios --release --no-codesign
